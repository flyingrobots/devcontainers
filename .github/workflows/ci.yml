name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    name: Build and smoke-test rust-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck scripts/* tests/*
      - name: Build flyingrobots/rust-dev:1.96.0
        run: scripts/build-image 1.96.0
      - name: Smoke test
        run: tests/smoke-image 1.96.0
